<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Wheels</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}
#container {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>

<script>
window.addEventListener("load", () => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  document.getElementById("container").appendChild(player);

  player.ruffle().load(
    "https://cdn.jsdelivr.net/gh/linuxfandudeguy/google-classroom@main/HappyWheels.swf"
  );
});
</script>

</body>
</html>
