name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      # 🔼 configure git (required for npm version)
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 📦 install deps (safe even if none)
      - name: Install dependencies
        run: npm ci || npm install

      # 🔼 bump version + commit + tag
      - name: Bump version
        run: npm version patch -m "chore(release): %s"

      # 🚀 push version bump + git tag
      - name: Push changes
        run: git push origin HEAD:main --follow-tags

      # 📦 publish to npm
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
